[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback for React Router. /.netlify/functions/* is reserved by
# Netlify and won't be caught by this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
